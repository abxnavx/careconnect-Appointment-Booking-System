<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Doctor Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/doctor.css}">
</head>

<body>



    <div class="container-fluid">

        <div class="row">

            <div class="col-md-2 p-0">



            </div>

            <div class="col-md-10 p-4">
                <div class="doctor-content">

                    <div class="mb-4">
                        <h2 class="page-heading" th:text="${doctor.id == null ? 'Add Doctor' : 'Edit Doctor'}">
                            Add Doctor
                        </h2>

                        <p class="page-subtitle">
                            Enter the doctor's professional and contact information.
                        </p>
                    </div>

                    <div class="doctor-form-card">

                        <form th:action="${doctor.id == null}
                ? @{/doctors/add}
                : @{/doctors/edit/{id}(id=${doctor.id})}" th:object="${doctor}" method="post">

                            <div class="row">

                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Doctor Name</label>
                                    <input type="text" th:field="*{name}" class="form-control"
                                        placeholder="Enter full name" required>
                                    <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}"
                                        class="text-danger small mt-1"></div>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Specialization</label>
                                    <input type="text" th:field="*{specialization}" class="form-control"
                                        placeholder="e.g. Cardiology" required>
                                    <div th:if="${#fields.hasErrors('specialization')}" th:errors="*{specialization}"
                                        class="text-danger small mt-1"></div>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Qualification</label>
                                    <input type="text" th:field="*{qualification}" class="form-control"
                                        placeholder="e.g. MBBS, MD" required>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Experience (years)</label>
                                    <input type="number" th:field="*{experience}" class="form-control" min="0"
                                        placeholder="Years of experience" required>
                                    <div th:if="${#fields.hasErrors('experience')}" th:errors="*{experience}"
                                        class="text-danger small mt-1"></div>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Phone Number</label>
                                    <input type="text" th:field="*{phoneNumber}" class="form-control"
                                        placeholder="Enter phone number" required>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Email Address</label>
                                    <input type="email" th:field="*{email}" class="form-control"
                                        placeholder="doctor@example.com" required>
                                    <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}"
                                        class="text-danger small mt-1"></div>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Consultation Fee (₹)</label>
                                    <input type="number" th:field="*{consultationFee}" class="form-control" min="0"
                                        step="0.01" placeholder="e.g. 500.00" required>
                                    <div th:if="${#fields.hasErrors('consultationFee')}" th:errors="*{consultationFee}"
                                        class="text-danger small mt-1"></div>
                                </div>

                                <div class="col-md-6 mb-3 d-flex align-items-end">
                                    <div class="form-check mb-2">
                                        <input type="checkbox" th:field="*{isActive}" class="form-check-input">
                                        <label class="form-check-label">
                                            Doctor is active
                                        </label>
                                    </div>
                                </div>

                            </div>

                            <div class="form-actions d-flex justify-content-end gap-2">

                                <a th:href="@{/doctors}" class="btn btn-outline-secondary">
                                    Cancel
                                </a>

                                <button type="submit" class="btn btn-primary">
                                    <span th:text="${doctor.id == null
                        ? 'Save Doctor'
                        : 'Update Doctor'}">
                                        Save Doctor
                                    </span>
                                </button>

                            </div>

                        </form>

                    </div>
                </div>

            </div>

        </div>

    </div>

</body>

</html>
