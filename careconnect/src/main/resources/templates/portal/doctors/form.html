<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="${doctor.id != null ? 'Edit Doctor' : 'Add Doctor'}">Doctor Form</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/doctor.css}">

</head>

<body>

    <div class="container-fluid">

        <div class="row">

            <div class="col-md-2 p-0">

                <div th:replace="~{portal/fragments/sidebar :: sidebar}"></div>

            </div>

            <div class="col-md-10 p-4">

                <h2 class="mb-4" th:text="${doctor.id != null ? 'Edit Doctor' : 'Add Doctor'}">
                    Add Doctor
                </h2>

                <form th:action="${doctor.id != null}
                        ? @{/doctors/edit/{id}(id=${doctor.id})}
                        : @{/doctors/add}" th:object="${doctor}" method="post" class="doctor-form">

                    <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}">

                    <div class="mb-3">

                        <label class="form-label">Name</label>

                        <input type="text" th:field="*{name}" class="form-control" required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">Specialization</label>

                        <input type="text" th:field="*{specialization}" class="form-control" required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">Qualification</label>

                        <input type="text" th:field="*{qualification}" class="form-control" required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">Experience</label>

                        <input type="number" th:field="*{experience}" class="form-control" min="0" required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">Phone Number</label>

                        <input type="text" th:field="*{phoneNumber}" class="form-control" required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">Email</label>

                        <input type="email" th:field="*{email}" class="form-control" required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">Consultation Fee</label>

                        <input type="number" th:field="*{consultationFee}" class="form-control" min="0" step="0.01"
                            required>

                    </div>

                    <div class="form-check mb-3">

                        <input type="checkbox" th:field="*{isActive}" class="form-check-input" id="isActiveCheck">

                        <label class="form-check-label" for="isActiveCheck">
                            Active
                        </label>

                    </div>

                    <div class="d-flex flex-column flex-sm-row gap-2 mt-4">

                        <a th:href="@{/doctors}" class="btn btn-secondary order-2 order-sm-1">
                            Cancel
                        </a>

                        <button type="submit" class="btn btn-primary order-1 order-sm-2"
                            th:text="${doctor.id != null ? 'Update Doctor' : 'Save Doctor'}">
                            Save Doctor
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</body>

</html>
