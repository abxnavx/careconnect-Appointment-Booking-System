<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div th:fragment="sidebar" class="cc-sidebar">

        <!-- Sidebar -->

        <aside class="sidebar">

            ```
            <div class="brand">
                <i class="bi bi-heart-pulse-fill"></i>
                <span>CareConnect</span>
            </div>

            <p class="sidebar-heading">MAIN MENU</p>

            <a href="/" class="nav-link" th:classappend="${activePage == 'dashboard'}
        ? ' active'">
                <i class="bi bi-grid-fill"></i>
                <span>Dashboard</span>
            </a>

            <a href="/appointments" class="nav-link" th:classappend="${activePage == 'appointments'}
        ? ' active'">
                <i class="bi bi-calendar-check"></i>
                <span>Appointments</span>
            </a>

            <p class="sidebar-heading">MANAGEMENT</p>

            <a href="/doctors" class="nav-link" th:classappend="${activePage == 'doctors'}
        ? ' active'">
                <i class="bi bi-person-badge"></i>
                <span>Doctor Management</span>
            </a>

            <a href="/users" class="nav-link" th:classappend="${activePage == 'users'}
        ? ' active'">
                <i class="bi bi-people"></i>
                <span>User Management</span>
            </a>
            </a>

            <p class="sidebar-heading">ANALYTICS</p>

            <a href="/reports" class="nav-link" th:classappend="${activePage == 'reports'}
        ? ' active'">
                <i class="bi bi-bar-chart-line"></i>
                <span>Reports</span>
            </a>

            <p class="sidebar-heading">ACCOUNT</p>

            <a href="/login?logout" class="nav-link">
                <i class="bi bi-box-arrow-right"></i>
                <span>Logout</span>
            </a>
            ```

        </aside>

    </div>

</body>

</html>
